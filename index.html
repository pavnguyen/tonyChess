<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>♟️ Chơi cờ Vua cùng Nam An</title>
    <meta
      name="description"
      content="Nam An - Cờ Vua - bé học Khai cuộc Grand Master, mẹo săn quân Trung cuộc và Tàn cuộc, có bàn cờ tương tác, Mắt Thần Cờ Vua và leo cấp Kỳ thủ Nhí."
    />

    <!-- Icon: SVG cho trình duyệt + PNG cho iOS khi bé "Thêm vào màn hình chính". -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1b2639" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-title" content="Cờ Vua Nhí" />

    <!--
      Thẻ chia sẻ mạng xã hội (Facebook / Zalo / X).
      `og:url` và `og:image` nên là ĐỊA CHỈ TUYỆT ĐỐI khi đã có tên miền, ví dụ:
        <meta property="og:url" content="https://co-vua-nhi.vn/" />
        <meta property="og:image" content="https://co-vua-nhi.vn/og-image.png" />
      Ảnh `public/og-image.png` (1200×630) sinh bằng: node scripts/generate-assets.mjs
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="Nam An - Cờ Vua" />
    <meta property="og:title" content="♟️ Chơi cờ Vua cùng Nam An" />
    <meta
      property="og:description"
      content="Bé học Khai cuộc Grand Master, săn quân Trung cuộc và Tàn cuộc qua bàn cờ tương tác - mỗi nước đi đều có lời giải thích dễ hiểu."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nam An - Cờ Vua - bàn cờ trắng xanh lá và quân Tốt trên nền giấy ngà" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="♟️ Chơi cờ Vua cùng Nam An" />
    <meta
      name="twitter:description"
      content="Bé học Khai cuộc Grand Master, săn quân Trung cuộc và Tàn cuộc qua bàn cờ tương tác - mỗi nước đi đều có lời giải thích dễ hiểu."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!--
      Font TỰ HOST (khai báo trong `src/index.css`): app là PWA chơi được khi mất
      mạng, nên không thể phụ thuộc Google Fonts - mất mạng là chữ rơi về font hệ
      thống, sai thiết kế và dấu tiếng Việt đổi dáng.

      Preload đúng 3 file nặng nhất mà màn hình đầu tiên cần: câu hướng dẫn (400),
      chữ đậm (700) và tiêu đề/nút (Baloo 800). Tất cả file đều nằm trong bản
      precache của Workbox nhờ `globPatterns` có `woff2`.
    -->
    <link rel="preload" href="/fonts/be-vietnam-pro-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/be-vietnam-pro-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/baloo-2-800-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
