name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Engine WASM là asset tĩnh của app; `verify` cần nó có mặt trong public/.
      - run: npm run setup:engine
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - run: npm run check:pwa
